<!-- @dsCard group="Forms" height=440 width=1200 subtitle="Settings: what it is on the left, the fields on the right, stacked on phones" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Settings row preview</title></head>
<body>
<div class="lms-container"><form novalidate>
<section class="lms-settings-row" aria-labelledby="s1"><div class="intro"><h2 id="s1">Branding</h2><p>Your name and logo appear in the header, browser tabs, emails and certificates.</p></div>
  <div class="fields"><div class="lms-field"><div class="box"><input id="sr-name" value="Operation Forward Learning" autocomplete="organization"></div><label for="sr-name">Site name</label></div></div></section>
<section class="lms-settings-row" aria-labelledby="s2"><div class="intro"><h2 id="s2">Accent colour</h2><p>Used for buttons, links, focus rings and highlights. We check every shade against the backgrounds and adjust it when needed so text stays readable.</p></div>
  <div class="fields"><div class="lms-field"><div class="box"><input id="sr-hex" value="#B4532A" maxlength="7" spellcheck="false"></div><label for="sr-hex">Hex colour</label></div><div class="lms-form-actions"><button class="lms-btn filled" type="submit">Save settings</button></div></div></section>
</form></div>
</body>
</html>
